# On a version tag (v0.1.0): run the full check, then build and publish
# ghcr.io/kisaesdevlab/vibe-portal:<version> and :latest (P40). The package is set public once,
# by hand, in the GitHub package settings; the source stays private.
name: release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
  packages: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # pnpm's version comes from package.json's packageManager.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # @kisaesdevlab/vibe-auth (P44) is on GitHub Packages.
      - run: printf '//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm gate
  image:
    needs: gate
    runs-on: ubuntu-24.04
    # Only this job can publish (QA 2026-11-09).
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kisaesdevlab/vibe-portal
          # A pre-release tag (v1.0.0-rc.1) never moves latest (QA 2026-11-09).
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=Vibe Portal
            org.opencontainers.image.licenses=PolyForm-Small-Business-1.0.0
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The image build reads @kisaesdevlab/vibe-auth from GitHub Packages (P44).
          secrets: |
            NODE_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}
