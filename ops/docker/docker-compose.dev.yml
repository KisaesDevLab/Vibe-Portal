# Development database for Vibe Portal. The API and portal run on the host (pnpm dev).
name: vibe-portal-dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vibe
      POSTGRES_PASSWORD: vibe
      POSTGRES_DB: vibe_portal
    ports:
      - '5433:5432'
    volumes:
      - vibe-portal-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vibe -d vibe_portal']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  vibe-portal-pg:
