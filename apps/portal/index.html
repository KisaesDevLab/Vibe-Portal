<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f6cbd" />
    <meta name="description" content="Client portal: files from and to your accounting firm." />
    <meta name="robots" content="noindex" />
    <title>Client Portal</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('vibe-theme');
          var prefersLight =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          document.documentElement.dataset.theme = stored || (prefersLight ? 'light' : 'dark');
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <!-- FONT_SCALE_BOOTSTRAP (injected from @vibe/ui tokens by vite.config) -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
